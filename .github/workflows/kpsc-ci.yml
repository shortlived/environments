name: kpsc CI

on:
  pull_request:
    paths:
      - "src/**"
      - "shell/**"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/kpsc-ci.yml"
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "shell/**"
      - "deno.json"
      - "deno.lock"

permissions:
  contents: read

jobs:
  lint-test:
    name: Deno lint + typecheck + test (Linux fast path)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KPSC_COMPILETIMEHASH: "ci-linux-test-do-not-use"
      KPSC_KEYCHAIN_BACKEND: "file"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install fish + zsh for shell tests
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/mod.ts
      - run: deno test -A --coverage=coverage src/tests/
      - name: Coverage report (human)
        run: deno coverage coverage --include="src/"
      - name: Enforce 80% line coverage (parsed from LCOV)
        run: |
          deno coverage coverage --include="src/" --lcov > coverage.lcov
          # LCOV emits LH:<lines hit> and LF:<lines found> per file. Sum
          # both totals across files; ratio is line coverage.
          lh=$(awk -F: '/^LH:/ {sum += $2} END {print sum+0}' coverage.lcov)
          lf=$(awk -F: '/^LF:/ {sum += $2} END {print sum+0}' coverage.lcov)
          if [[ "$lf" -eq 0 ]]; then
            echo "::error::No lines found in coverage report"
            exit 1
          fi
          pct=$(awk -v h="$lh" -v f="$lf" 'BEGIN{printf "%.2f", (h*100.0)/f}')
          echo "line coverage = ${pct}% (${lh}/${lf})"
          awk -v v="$pct" 'BEGIN{exit (v+0 < 80)}'

  macos-build:
    name: Deno compile smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    needs: lint-test
    env:
      KPSC_COMPILETIMEHASH: "ci-macos-test-do-not-use"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno test -A src/tests/
      - name: Compile current host
        run: deno compile --allow-net --allow-run --allow-env --allow-read --allow-write --output dist/kpsc src/mod.ts
      - name: Smoke test compiled binary
        run: ./dist/kpsc version
