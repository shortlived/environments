name: Build and Release Deno Binaries

# Triggered by a new v* tag (pushed by bump.yml or `mise run tag:push`).
# Compiles native Deno binaries per platform, builds + pushes a multi-arch
# Docker image to ghcr.io, then creates a GitHub Release with all artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build-${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Ensure version.ts matches deno.json
        run: mise run build

      - name: Get metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(jq -r '.version' deno.json)
          NAME=$(jq -r '.name // "orchestras"' deno.json | sed 's|.*/||')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Compile Binary
        shell: bash
        run: |
          ENTRY=$(jq -r '.main // "src/mod.ts"' deno.json)
          deno compile --allow-all --no-check \
            --target=${{ matrix.target }} \
            --output "${{ steps.meta.outputs.name }}-${{ matrix.suffix }}${{ matrix.ext }}" \
            "${ENTRY}"

      - name: Generate Checksum
        shell: bash
        run: |
          BINARY="${{ steps.meta.outputs.name }}-${{ matrix.suffix }}${{ matrix.ext }}"
          if command -v shasum &>/dev/null; then
            shasum -a 256 "${BINARY}" > "${{ steps.meta.outputs.name }}-${{ matrix.suffix }}.sha256"
          else
            sha256sum "${BINARY}" > "${{ steps.meta.outputs.name }}-${{ matrix.suffix }}.sha256"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.suffix }}
          path: |
            ${{ steps.meta.outputs.name }}-${{ matrix.suffix }}${{ matrix.ext }}
            ${{ steps.meta.outputs.name }}-${{ matrix.suffix }}.sha256

  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Get metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' deno.json)
          NAME=$(jq -r '.name // "orchestras"' deno.json | sed 's|.*/||')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.package
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TAG=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Read changelog excerpt
        id: notes
        run: |
          if [ -f CHANGELOG.md ]; then
            body=$(awk '/^## \[/{if(p)exit; p=1} p' CHANGELOG.md | head -100)
            {
              echo "body<<EOF"
              echo "${body}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=Release ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
